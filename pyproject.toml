[project]
name = "auto-email"
version = "0.2.0"
description = "Local-first desktop mailing workbench with verified lists and recoverable tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "pywebview>=6.1",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pillow>=12.2.0",
    "pyinstaller>=6.19.0",
]
