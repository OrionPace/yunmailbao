name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync locked environment
        run: uv sync --locked --python 3.12
      - name: Validate release script and read project version
        id: version
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/build_release.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $version = uv run --no-sync python -B -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid installer version' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Unit tests (no SMTP credentials)
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check static/script.js
      - name: Browser workflow (isolated demonstration)
        shell: pwsh
        run: |
          Push-Location tests/browser
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependencies failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          Pop-Location
          $env:YUNYOUBAO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'yunyoubao-browser'
          $python = Join-Path $PWD '.venv/Scripts/python.exe'
          $preview = Start-Process -FilePath $python -ArgumentList '-B main.py --headless --demo --port 8131' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              try { $null = Invoke-WebRequest http://127.0.0.1:8131/ -TimeoutSec 2; $ready = $true; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw 'Demonstration server did not start' }
            npm --prefix tests/browser test
            if ($LASTEXITCODE -ne 0) { throw 'Browser workflow failed' }
            node tests/browser/product-ui.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Product UI acceptance failed' }
          } finally {
            Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          }
      - name: Build clean onedir candidate
        run: uv run --no-sync python -m PyInstaller --noconfirm --clean --distpath .build/candidate --workpath .build/work auto_email.spec
      - name: Reject environment files and personal runtime
        shell: pwsh
        run: |
          $candidate = '.build/candidate/YunYouBao'
          if (-not (Test-Path "$candidate/YunYouBao.exe")) { throw 'Missing candidate executable' }
          if (Get-ChildItem $candidate -Force -Recurse | Where-Object Name -Like '.env*') { throw 'Environment files in artifact' }
          foreach ($base in @($candidate, "$candidate/_internal")) {
            foreach ($name in @('runtime', 'logs', 'state', 'uploads', 'data')) {
              if (Test-Path "$base/$name") { throw "Personal runtime in artifact: $name" }
            }
          }
          foreach ($asset in @('LICENSE', 'THIRD_PARTY_NOTICES.md', 'static/script.js', 'static/fonts/SourceHanSansCN-VF.ttf.woff2', 'static/fonts/SourceHanSans-LICENSE.txt', 'assets/branding/yunyoubao-fox-v1.ico')) {
            if (-not (Test-Path "$candidate/_internal/$asset")) { throw "Missing asset: $asset" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: YunMailBao-${{ steps.version.outputs.version }}-windows-x64-onedir
          path: .build/candidate/YunYouBao/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
