<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>云邮宝</title>
<link rel="icon" href="/static/brand-icon.png">
<link rel="stylesheet" href="/static/vendor/quill.snow.css"><link rel="stylesheet" href="/static/style.css">
<script defer src="/static/vendor/quill.min.js"></script><script defer src="/static/vendor/lucide.min.js"></script><script defer src="/static/script.js"></script>
</head>
<body>
<header class="app-header">
<a class="brand" href="#workspace"><img src="/static/brand-icon.png" alt="白狐"><strong>云邮宝</strong><span id="version">v0.2</span></a>
<nav aria-label="主导航"><button data-view="workspace" class="nav active"><i data-lucide="layout-dashboard"></i>工作台</button><button data-view="history" class="nav"><i data-lucide="list-checks"></i>任务记录</button><button data-view="help" class="nav"><i data-lucide="book-open"></i>使用帮助</button></nav>
<div class="header-tools"><div class="segmented" aria-label="运行模式"><button data-mode="live">正式</button><button data-mode="demo">演示</button></div><button id="theme" class="icon" title="切换明暗主题" aria-label="切换明暗主题"><i data-lucide="sun-moon"></i></button><button id="settings-open" class="icon" title="设置" aria-label="设置"><i data-lucide="settings-2"></i></button></div>
</header>
<div id="demo-banner" class="demo-banner" hidden><i data-lucide="flask-conical"></i><strong>演示模式</strong><span>虚构名单与模拟发送，不投递真实邮件；数据与正式模式隔离。</span><button id="demo-load">载入演示名单</button></div>
<div id="connection" class="connection" hidden role="alert"></div>
<main id="workspace" class="view">
<div class="workspace-heading"><div><h1>准备发送任务</h1></div><div class="inline"><span id="draft-state" class="muted">未保存草稿</span><button id="draft-open"><i data-lucide="folder-open"></i>草稿</button><button id="draft-save"><i data-lucide="save"></i>保存草稿</button></div></div>
<div class="work-layout"><div class="composer">
<nav class="steps" aria-label="任务步骤"><button data-step="1" class="active"><span>01</span>名单<i data-lucide="users"></i></button><button data-step="2"><span>02</span>邮件<i data-lucide="mail"></i></button><button data-step="3"><span>03</span>账号与节奏<i data-lucide="sliders-horizontal"></i></button><button data-step="4"><span>04</span>核对发送<i data-lucide="shield-check"></i></button></nav>
<section id="step-1" class="step">
<div class="section-head"><div><h2>收件名单</h2><p id="import-name" class="muted">尚未导入名单</p></div><button id="import-trigger"><i data-lucide="upload"></i>导入名单</button><input id="import-file" type="file" accept=".xlsx,.csv" hidden></div>
<div id="import-empty" class="empty dropzone" tabindex="0" role="button" aria-label="导入 XLSX 或 CSV 名单"><i data-lucide="file-spreadsheet"></i><strong>选择或拖入名单</strong><span>.xlsx / .csv</span></div>
<div id="import-content" hidden>
<div class="fields three"><label>工作表<select id="sheet"></select></label><label>姓名列<select id="name-column"></select></label><label>邮箱列<select id="email-column"></select></label></div>
<div class="filter-heading"><h3>筛选范围</h3><div class="inline"><button id="division-filter"><i data-lucide="network"></i>按分工筛选</button><button id="filter-add"><i data-lucide="plus"></i>添加条件</button><button id="filter-clear" class="icon" title="清空筛选" aria-label="清空筛选"><i data-lucide="filter-x"></i></button></div></div>
<div id="filters"></div><div id="import-counts" class="counts"></div>
<div class="section-head compact"><label class="check"><input id="problem-only" type="checkbox">仅看问题行</label><div class="inline"><span id="preflight-state" class="muted">等待预检</span><button id="preflight-refresh" class="icon" title="重新预检" aria-label="重新预检"><i data-lucide="refresh-cw"></i></button></div></div>
<div class="table-wrap"><table id="recipients-table"><thead></thead><tbody></tbody></table></div>
<div class="pagination"><span id="import-page-label"></span><div class="inline"><select id="import-page-size" aria-label="每页行数"><option value="20">20 行</option><option value="50">50 行</option><option value="100">100 行</option></select><button id="import-prev" class="icon" title="上一页" aria-label="上一页"><i data-lucide="chevron-left"></i></button><button id="import-next" class="icon" title="下一页" aria-label="下一页"><i data-lucide="chevron-right"></i></button></div></div>
</div></section>
<section id="step-2" class="step" hidden>
<div class="section-head"><h2>邮件内容</h2><button id="focus-editor" class="icon" title="专注编辑" aria-label="专注编辑"><i data-lucide="maximize-2"></i></button></div>
<label>邮件主题<input id="subject" maxlength="200" placeholder="填写邮件主题"></label>
<div class="variable-bar"><label>插入变量<select id="variable-column"><option value="">选择名单列</option></select></label><div class="segmented"><button data-variable-target="body" class="active">正文</button><button data-variable-target="subject">主题</button></div><button id="variable-insert" class="icon" title="插入变量" aria-label="插入变量"><i data-lucide="braces"></i></button></div>
<div class="editor-shell">
<div id="editor-toolbar" aria-label="正文工具栏">
<div class="editor-command-row"><button id="attachment-upload" title="添加附件（PDF / DOCX / XLSX / PPTX，最大 20 MiB）" aria-label="添加附件"><i data-lucide="paperclip"></i>附件</button><span id="attachment-chip" class="attachment-chip" hidden><span id="attachment-label"></span><button id="attachment-remove" title="移除附件" aria-label="移除附件"><i data-lucide="x"></i></button></span><input id="attachment-file" type="file" accept=".pdf,.docx,.xlsx,.pptx" hidden><span class="toolbar-spacer"></span><button id="template-open" title="选择模板" aria-label="选择模板"><i data-lucide="files"></i></button><button id="editor-preview" title="预览邮件" aria-label="预览邮件"><i data-lucide="scan-eye"></i></button><button id="editor-undo" title="撤销" aria-label="撤销" disabled><i data-lucide="undo-2"></i></button><button id="editor-redo" title="重做" aria-label="重做" disabled><i data-lucide="redo-2"></i></button></div>
<div class="editor-format-row">
<select id="editor-font" data-format="font" title="字体" aria-label="字体"><option value="Source Han Sans SC">思源黑体</option><option value="Microsoft YaHei">微软雅黑</option><option value="SimSun">宋体</option><option value="Georgia">衬线</option><option value="monospace">等宽</option></select>
<select id="editor-size" data-format="size" title="字号" aria-label="字号"><option>12px</option><option selected>14px</option><option>16px</option><option>18px</option><option>24px</option><option>32px</option></select>
<button class="ql-bold" title="加粗" aria-label="加粗"></button><button class="ql-italic" title="斜体" aria-label="斜体"></button><button class="ql-underline" title="下划线" aria-label="下划线"></button><button class="ql-strike" title="删除线" aria-label="删除线"></button>
<label class="color-tool" title="文字颜色"><i data-lucide="baseline"></i><input id="editor-color" type="color" value="#202429" data-format="color" title="文字颜色" aria-label="文字颜色"></label><label class="color-tool" title="背景颜色"><i data-lucide="highlighter"></i><input id="editor-background" type="color" value="#ffffff" data-format="background" title="背景颜色" aria-label="背景颜色"></label>
<button class="ql-list" value="ordered" title="编号列表" aria-label="编号列表"></button><button class="ql-list" value="bullet" title="项目列表" aria-label="项目列表"></button>
<select id="editor-align" data-format="align" title="对齐" aria-label="对齐"><option value="">左对齐</option><option value="center">居中</option><option value="right">右对齐</option><option value="justify">两端对齐</option></select>
<button class="ql-indent" value="-1" title="减少缩进" aria-label="减少缩进"></button><button class="ql-indent" value="+1" title="增加缩进" aria-label="增加缩进"></button>
<select id="editor-lineheight" data-format="lineheight" title="行距" aria-label="行距"><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="1.8" selected>1.8 倍</option><option value="2">2 倍</option></select>
<button class="ql-link" title="链接" aria-label="链接"></button><button class="ql-image" title="插入图片" aria-label="插入图片"></button><button class="ql-clean" title="清除格式" aria-label="清除格式"></button>
</div></div><div id="editor"></div></div><div id="content-issues" class="issues" aria-live="polite"></div>
<details id="send-options" class="advanced"><summary>更多发送选项</summary><label class="check"><input type="checkbox" id="commercial">邮件包含商业广告</label><label class="check"><input type="checkbox" id="unsubscribe" checked>添加退订联系方式</label></details>
</section>
<section id="step-3" class="step" hidden>
<div class="section-head"><h2>发件账号</h2><button id="account-add"><i data-lucide="plus"></i>新增账号</button></div><div id="accounts"></div>
<div class="section-head separated"><h2>发送窗口</h2></div><div class="fields two"><label>开始时间<input id="start-time" type="time" value="08:00"></label><label>结束时间<input id="end-time" type="time" value="21:40"></label></div>
<div class="notice"><i data-lucide="clock-3"></i><span>节奏按账号分别控制；窗口外、额度耗尽或服务异常时，以任务暂停原因判断后续操作。</span></div>
</section>
<section id="step-4" class="step" hidden>
<div class="section-head"><h2>核对发送</h2><button id="review-refresh"><i data-lucide="shield-check"></i>重新预检</button></div><label>任务名称<input id="task-title" placeholder="例如：十月培训通知"></label><div id="review-summary" class="review-summary"></div><div id="review-checks"></div>
<label class="check separated"><input id="send-consent" type="checkbox">已核对名单、内容和授权范围，确认创建此任务</label><div class="notice"><i data-lucide="info"></i><span>创建任务不会立即发送。请在任务监控中明确启动；服务器已接收不代表最终送达。</span></div>
</section>
<footer class="compose-footer"><button id="step-back"><i data-lucide="arrow-left"></i>上一步</button><span id="step-position" class="muted">01 / 04</span><button id="step-next">下一步<i data-lucide="arrow-right"></i></button></footer>
</div><aside class="monitor" aria-label="任务监控"><div class="section-head"><h2>任务监控</h2><button id="monitor-refresh" class="icon" title="刷新任务" aria-label="刷新任务"><i data-lucide="refresh-cw"></i></button></div><div id="monitor-content" class="monitor-content"></div></aside></div>
</main>
<main id="history" class="view" hidden><div class="workspace-heading"><div><p class="eyebrow">TASK ARCHIVE</p><h1>任务记录</h1></div><button id="history-refresh"><i data-lucide="refresh-cw"></i>刷新</button></div><div class="fields two history-filters"><label>搜索<input id="task-search" type="search" placeholder="任务名称"></label><label>状态<select id="task-status"><option value="">全部状态</option><option value="ready">待启动</option><option value="running">运行中</option><option value="paused">已暂停</option><option value="completed">已完成</option><option value="completed_with_issues">完成但有问题</option></select></label></div><div id="task-list"></div><section id="task-detail" class="task-detail" hidden></section></main>
<main id="help" class="view" hidden><div class="workspace-heading"><div><h1>使用帮助</h1></div><label class="search-label"><i data-lucide="search"></i><input id="help-search" type="search" placeholder="搜索导入、授权码、待确认…" aria-label="搜索帮助"></label></div><section id="help-flow" aria-label="发送流程与结果"></section><div class="help-layout"><nav id="help-directory" aria-label="帮助目录"></nav><div id="help-articles"></div></div></main>
<footer id="action-bar" class="action-bar"><div><span id="mode-label" class="badge">正式模式</span><span id="selection-summary">尚未导入名单</span></div><div class="inline"><button id="preview-open"><i data-lucide="scan-eye"></i>预览</button><button id="test-open"><i data-lucide="send-horizontal"></i>测试发送</button><button id="task-create" class="primary"><i data-lucide="shield-check"></i>创建待发送任务</button></div></footer>
<div id="drawer-backdrop" class="backdrop" hidden></div>
<aside id="settings" class="drawer" hidden aria-label="设置"><div class="section-head"><h2>设置</h2><button id="settings-close" class="icon" title="关闭设置" aria-label="关闭设置"><i data-lucide="x"></i></button></div><section><h3>数据与备份</h3><dl id="data-info"></dl><div class="button-stack"><button id="data-folder"><i data-lucide="folder-open"></i>打开数据目录</button><button id="data-backup"><i data-lucide="download"></i>备份当前模式数据</button><button id="data-restore"><i data-lucide="archive-restore"></i>恢复备份</button><button id="data-legacy"><i data-lucide="import"></i>导入旧版数据</button><input id="restore-file" type="file" hidden></div></section><section><h3>退订与排除名单</h3><label>每行一个邮箱<textarea id="suppressions" rows="7" spellcheck="false"></textarea></label><button id="suppression-save"><i data-lucide="save"></i>保存排除名单</button></section><section><h3>清理</h3><label class="check"><input id="cleanup-logs" type="checkbox" checked>历史日志</label><label class="check"><input id="cleanup-imports" type="checkbox" checked>未使用的导入文件</label><button id="data-cleanup" class="danger"><i data-lucide="trash-2"></i>清理所选数据</button></section></aside>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="modal-content"></div></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
